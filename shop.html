<!doctype html>
<html lang="en-ZA" data-type="place"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="page-type" content="place"><meta name="site-kind" content="other"><meta name="page-kind" content="place">
<title>Shop | Sama-R Shop</title><meta name="description" content="Browse the full collection and order online.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto+Condensed:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/theme.css"></head>
<body data-page="shop"><div id="site-header"></div><main id="main"><section aria-labelledby="shop-h">
  <div class="wrap">
    <h1 id="shop-h">Shop</h1>
    <p class="lead">Every product is priced in rand. Add what you like to your cart, then choose collection or delivery at checkout.</p>
    <div class="toolbar" id="shop">
      <div class="field grow"><label for="search">Search products</label><input id="search" type="search" placeholder="Search by name or description" autocomplete="off"></div>
      <div class="field"><label for="sort">Sort by</label><select id="sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name</option></select></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    <p class="muted" id="count" aria-live="polite"></p>
    <div class="grid" id="grid">
      <article class="card skel"><div class="frame"></div><div class="card-body"></div></article>
      <article class="card skel"><div class="frame"></div><div class="card-body"></div></article>
      <article class="card skel"><div class="frame"></div><div class="card-body"></div></article>
      <article class="card skel"><div class="frame"></div><div class="card-body"></div></article>
    </div>
    <noscript><p>Please turn on JavaScript to browse and order.</p></noscript>
  </div>
</section>
</main><div id="site-footer"></div>
<script src="js/config.js" defer></script><script src="js/products.js" defer></script><script src="js/layout.js" defer></script><script src="js/site.js" defer></script></body></html>
