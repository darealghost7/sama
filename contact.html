<!doctype html>
<html lang="en-ZA" data-type="place"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="page-type" content="place"><meta name="site-kind" content="other"><meta name="page-kind" content="place">
<title>Contact | Sama-R Shop</title><meta name="description" content="Order online, pay by EFT, then collect from the shop or have them delivered.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto+Condensed:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/theme.css"></head>
<body data-page="contact"><div id="site-header"></div><main id="main"><section aria-labelledby="contact-h">
  <div class="wrap">
    <h1 id="contact-h">Contact Sama-R Shop</h1>
    <div class="split">
      <div><div data-contact></div></div>
      <form id="contact-form" novalidate>
        <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" autocomplete="name" required><span class="err" data-err="name"></span></div>
        <div class="field"><label for="c-email">Email address</label><input id="c-email" name="email" type="email" autocomplete="email" required><span class="err" data-err="email"></span></div>
        <div class="field"><label for="c-phone">Phone number (optional)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"><span class="err" data-err="phone"></span></div>
        <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" rows="5" required></textarea><span class="err" data-err="message"></span></div>
        <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <button class="btn" type="submit">Send message</button>
        <p class="notice" id="contact-status" role="status" hidden></p>
      </form>
    </div>
  </div>
</section>
</main><div id="site-footer"></div>
<script src="js/config.js" defer></script><script src="js/products.js" defer></script><script src="js/layout.js" defer></script><script src="js/site.js" defer></script><script src="js/contact.js" defer></script></body></html>
